<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fonda's Little World Guestbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Special+Elite&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f1e8;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e0d6c8;
      --card: #fffcf7;
      --shadow: 0 12px 40px rgba(40, 30, 20, 0.08);
      --shadow-lg: 0 20px 50px rgba(40, 30, 20, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }
    body.no-scroll {
      overflow: hidden;
      height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index: 9999;
    }

    .screen {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 48px;
      animation: fadeIn 0.45s ease;
    }
    .sign-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      margin-bottom: 8px;
      padding-bottom: 0;
    }
    #sign .sign-wrap {
      padding-bottom: 8px;
    }
    #sign.screen.active {
      display: flex;
      overflow: hidden;
      height: 100vh;
      max-height: 100vh;
      min-height: 0;
      padding: 20px 20px 16px;
      justify-content: flex-start;
    }
    .screen.active { display: flex; }
    #welcome.screen.active {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    /* ——— WELCOME ——— */
    #welcome {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      min-height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      padding: 32px 24px;
      position: relative;
      /* starry fabric from portfolio-starry-bg.css */
      background-color: #f5e9db;
      background-image: url('./portfolio-bg-texture.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    @supports not (background-image: url('./portfolio-bg-texture.webp')) {
      #welcome {
        background-image: url('./portfolio-bg-texture.jpg');
      }
    }
    #welcome .stars {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    #welcome .welcome-layout {
      position: relative;
      z-index: 2;
    }
    .welcome-layout {
      display: block;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }
    .welcome-inner {
      max-width: 440px;
      text-align: center;
      margin: 0 auto;
    }
    /* iPod on the right — absolute so center content stays centered */
    #welcome .ipod-slot,
    .ipod-slot {
      position: absolute;
      right: clamp(20px, 5vw, 72px);
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      flex: none;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
    }
    .ipod-slot .ipod-player {
      width: min(20vw, 210px);
    }
    /* Tablet / mobile: stack iPod under the centered content */
    @media (max-width: 700px) {
      #welcome .ipod-slot,
      .ipod-slot {
        position: relative;
        right: auto;
        top: auto;
        transform: none;
        margin: 24px auto 0;
        width: 100%;
      }
      .ipod-slot .ipod-player {
        width: min(42vw, 180px);
      }
      #welcome {
        overflow-y: auto;
        max-height: none;
        height: auto;
        min-height: 100vh;
        padding-bottom: 32px;
      }
      body.no-scroll { overflow: auto; height: auto; }
    }
    @media (max-width: 520px) {
      .ipod-slot .ipod-player {
        width: min(50vw, 160px);
      }
    }
    .envelope-icon {
      width: 110px;
      height: auto;
      margin: 0 auto 22px;
      display: block;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,0.12));
      animation: float 4.5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .welcome-title {
      font-family: "Playfair Display", serif;
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 14px;
    }
    .welcome-sub {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-family: inherit;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--ink);
      color: #fff;
      box-shadow: 0 8px 24px rgba(28, 25, 23, 0.18);
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-primary:hover,
    .btn-primary:active,
    .btn-primary:focus-visible {
      background: #f8d6c5;
      color: #1a1a1a;
      box-shadow: 0 8px 24px rgba(248, 214, 197, 0.45);
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      background: var(--ink);
      color: #fff;
      box-shadow: none;
    }
    .btn-primary:disabled:hover {
      background: var(--ink);
      color: #fff;
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      font-weight: 500;
      font-size: 14px;
      padding: 10px 16px;
    }
    .btn-ghost:hover { color: var(--ink); }
    .btn-outline {
      background: var(--card);
      color: var(--ink);
      border: 1.5px solid var(--line);
    }
    .btn-outline:hover { border-color: var(--ink); }

    /* ——— SIGN (single page) ——— */
    #sign {
      justify-content: flex-start;
      padding-top: 20px;
    }
    .sign-wrap {
      width: 100%;
      max-width: 440px;
    }
    .sign-header {
      text-align: center;
      margin-bottom: 14px;
    }
    .sign-header h2 {
      font-family: "Playfair Display", serif;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 0;
    }
    .sign-header p {
      color: var(--muted);
      font-size: 14px;
    }

    .field {
      margin-bottom: 12px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .field input {
      width: 100%;
      border: 1.5px solid var(--line);
      background: var(--card);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--ink); }
    .field input::placeholder { color: #b0a89e; }

    .card-pick-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .card-thumbs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .card-thumb {
      position: relative;
      aspect-ratio: 1.5;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      border: 2.5px solid transparent;
      background: transparent;
      padding: 0;
      transition: border-color 0.15s, transform 0.15s;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-thumb.selected {
      border-color: var(--ink);
      transform: scale(1.04);
    }
    .card-thumb .check {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-size: 11px;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .card-thumb.selected .check { display: flex; }

    /* Live card preview – no extra background, just the PNG */
    .preview-wrap {
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
    }
    .card-preview {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1.5;
      position: relative;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      filter: drop-shadow(0 10px 28px rgba(0,0,0,0.1));
    }
    .card-preview.type-0 { background-image: url('card1.png'); }
    .card-preview.type-1 { background-image: url('card2.png'); }
    .card-preview.type-2 { background-image: url('card3.png'); }
    .card-preview.type-3 { background-image: url('card4.png'); }

    .preview-name {
      position: absolute;
      left: 11.5%;
      top: 37.5%;
      font-family: "Special Elite", "Courier New", Courier, monospace;
      font-size: clamp(12px, 2.9vw, 15px);
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.12);
      max-width: 52%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .preview-date {
      position: absolute;
      left: 11.5%;
      top: 55.5%;
      font-family: "Special Elite", "Courier New", Courier, monospace;
      font-size: clamp(11px, 2.6vw, 14px);
      font-weight: 400;
      letter-spacing: 0.06em;
      color: #fff;
      text-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }
    .preview-sig {
      position: absolute;
      left: 30%;
      right: 12%;
      bottom: 12%;
      height: 22%;
    }
    .preview-sig canvas {
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    .sig-tools {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .tool-btn {
      border: 1.5px solid var(--line);
      background: var(--card);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      color: var(--muted);
      font-family: inherit;
    }
    .tool-btn:hover { border-color: var(--ink); color: var(--ink); }

    .sign-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-top: 8px;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    /* ——— GALLERY ——— */
    #gallery {
      justify-content: flex-start;
      padding-top: 36px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }
    .gallery-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }
    .gallery-header h1 {
      font-family: "Playfair Display", serif;
      font-size: 28px;
      font-weight: 600;
    }
    .gallery-header p {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.04em;
      margin-top: 4px;
    }
    .gallery-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stats-bar {
      width: 100%;
      background: #faf7f1;
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px 32px;
      font-size: 13px;
      color: var(--muted);
    }
    .stats-bar strong {
      color: var(--ink);
      font-weight: 600;
    }

    .gallery-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .guest-card {
      aspect-ratio: 1.5;
      position: relative;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      cursor: pointer;
      transition: transform 0.2s;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.08));
    }
    .guest-card:hover { transform: translateY(-3px); }
    .guest-card.type-0 { background-image: url('card1.png'); }
    .guest-card.type-1 { background-image: url('card2.png'); }
    .guest-card.type-2 { background-image: url('card3.png'); }
    .guest-card.type-3 { background-image: url('card4.png'); }

    .guest-card .g-name {
      position: absolute;
      left: 11.5%;
      top: 37.5%;
      font-family: "Special Elite", "Courier New", Courier, monospace;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.12);
      max-width: 52%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .guest-card .g-date {
      position: absolute;
      left: 11.5%;
      top: 55.5%;
      font-family: "Special Elite", "Courier New", Courier, monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: #fff;
      text-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }
    .guest-card .g-meta {
      position: absolute;
      left: 11.5%;
      right: 12%;
      bottom: 12%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .guest-card .g-no {
      font-size: 10px;
      opacity: 0.7;
      color: #fff;
      letter-spacing: 0.04em;
    }
    .guest-card .g-sig {
      max-width: 45%;
      text-align: right;
    }
    .guest-card .g-sig img,
    .guest-card .g-sig svg {
      max-width: 110px;
      max-height: 32px;
      vertical-align: bottom;
    }
    .guest-card .g-sig-text {
      font-family: "Caveat", cursive;
      font-size: 18px;
      color: #fff;
      display: inline-block;
      transform: rotate(-2deg);
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 16, 12, 0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: transparent;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .modal .big-card {
      width: 100%;
      aspect-ratio: 1.5;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      filter: drop-shadow(0 16px 40px rgba(0,0,0,0.2));
      margin-bottom: 16px;
    }
    .modal-close {
      background: var(--card);
      border: none;
      border-radius: 999px;
      padding: 10px 24px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: var(--ink);
      color: #fff;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: transform 0.3s ease, opacity 0.3s ease, visibility 0.3s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      visibility: visible; transform: translateX(-50%) translateY(0); }


    /* iPod bubble + player base styles (position comes from #welcome .ipod-slot) */
    .ipod-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .ipod-click-bubble {
      position: absolute;
      top: 8%;
      left: 72%;
      transform: translateX(-50%);
      right: auto;
      background: #fff;
      color: #1a1a1a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 14px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.14);
      white-space: nowrap;
      z-index: 5;
      pointer-events: none;
      animation: bubble-bob 2.4s ease-in-out infinite;
    }
    .ipod-click-bubble::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #fff;
    }
    @keyframes bubble-bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-4px); }
    }
    .ipod-player {
      position: relative;
      display: inline-block;
      width: 100%;
      line-height: 0;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      filter: drop-shadow(0 12px 28px rgba(0,0,0,0.12));
    }
    .ipod-player img.ipod-art {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }
    .progress-layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      clip-path: inset(0 calc(100% - var(--progress, 0%)) 0 0);
      -webkit-clip-path: inset(0 calc(100% - var(--progress, 0%)) 0 0);
    }
    .progress-layer img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }
    .play-hit {
      position: absolute;
      left: 36%;
      top: 51%;
      width: 30%;
      height: 22%;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      outline: none;
      z-index: 3;
    }
    .play-hit:focus-visible {
      box-shadow: 0 0 0 3px rgba(16, 168, 87, 0.7);
    }
    .play-hit:active { transform: scale(0.97); }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }
    .welcome-sub {
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 0;
      line-height: 1.45;
    }

    @media (max-width: 520px) {
      .card-thumbs { grid-template-columns: repeat(2, 1fr); }
      .sign-actions { flex-direction: column; }
      .sign-actions .btn { width: 100%; }
    }

    100% { transform: translateX(-50%); }
    }
    @media (max-width: 700px) {
      }
  </style>
  <link rel="stylesheet" href="portfolio-starry-bg.css" />
</head>
<body>
  <!-- WELCOME -->
  <div id="welcome" class="screen active portfolio-bg">

    <div class="stars" aria-hidden="true">
      <div class="star" style="left:18%; top:14%; --size:18px; --dur:3.4s; --delay:0.2s; --rot:12deg;"></div>
      <div class="star" style="left:76%; top:17%; --size:17px; --dur:2.8s; --delay:1.1s; --rot:-8deg;"></div>
      <div class="star" style="left:57%; top:49%; --size:16px; --dur:4.1s; --delay:0.7s; --rot:5deg;"></div>
      <div class="star" style="left:15%; top:81%; --size:17px; --dur:3.2s; --delay:1.8s; --rot:-15deg;"></div>
      <div class="star" style="left:79%; top:89%; --size:16px; --dur:3.7s; --delay:0.4s; --rot:20deg;"></div>
      <div class="star" style="left:48%; top:4%;  --size:13px; --dur:2.6s; --delay:0.9s; --rot:0deg;"></div>
      <div class="star" style="left:12%; top:13%; --size:12px; --dur:3.9s; --delay:2.1s; --rot:25deg;"></div>
      <div class="star" style="left:82%; top:16%; --size:13px; --dur:2.9s; --delay:0.3s; --rot:-20deg;"></div>
      <div class="star" style="left:23%; top:63%; --size:14px; --dur:3.5s; --delay:1.4s; --rot:8deg;"></div>
      <div class="star" style="left:28%; top:65%; --size:11px; --dur:4.3s; --delay:0.6s; --rot:-5deg;"></div>

  <script>
    // ——— Name pools for 147 seed guests ———
    const FIRST = [
      "Emma","Liam","Olivia","Noah","Ava","Ethan","Sophia","Mason","Isabella","Logan",
      "Mia","Lucas","Charlotte","Oliver","Amelia","Aiden","Harper","James","Evelyn","Benjamin",
      "Abigail","Elijah","Emily","Alexander","Elizabeth","Michael","Sofia","Daniel","Avery","Matthew",
      "Ella","Samuel","Scarlett","David","Grace","Joseph","Chloe","Carter","Victoria","Wyatt",
      "Riley","John","Aria","Owen","Lily","Dylan","Aubrey","Luke","Zoey","Gabriel",
      "Penelope","Anthony","Lillian","Isaac","Addison","Grayson","Layla","Jack","Natalie","Julian",
      "Hannah","Levi","Brooklyn","Aaron","Zoe","Charles","Nora","Thomas","Leah","Caleb",
      "Savannah","Christopher","Audrey","Joshua","Claire","Andrew","Eleanor","Lincoln","Skylar","Mateo",
      "Ellie","Ryan","Stella","Jaxon","Paisley","Nathan","Violet","Isaiah","Mila","Hunter",
      "Lucy","Cameron","Anna","Connor","Caroline","Maya","Jordan","Kai","Elena","Theo",
      "Aisha","Priya","Marcus","Yuki","Diego","Omar","Clara","Ravi","Isabelle","Felix",
      "Zara","Mei","Soren","Ivy","Hugo","Nina","Leo","Jade","Finn","Rosa"
    ];
    const LAST = [
      "Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis","Rodriguez","Martinez",
      "Hernandez","Lopez","Gonzalez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin",
      "Lee","Perez","Thompson","White","Harris","Sanchez","Clark","Ramirez","Lewis","Robinson",
      "Walker","Young","Allen","King","Wright","Scott","Torres","Nguyen","Hill","Flores",
      "Green","Adams","Nelson","Baker","Hall","Rivera","Campbell","Mitchell","Carter","Roberts",
      "Gomez","Phillips","Evans","Turner","Diaz","Parker","Cruz","Edwards","Collins","Reyes",
      "Stewart","Morris","Morales","Murphy","Cook","Rogers","Gutierrez","Ortiz","Morgan","Cooper",
      "Peterson","Bailey","Reed","Kelly","Howard","Ramos","Kim","Cox","Ward","Richardson",
      "Watson","Brooks","Chavez","Wood","James","Bennett","Gray","Mendoza","Ruiz","Hughes",
      "Price","Alvarez","Castillo","Sanders","Patel","Myers","Long","Chen","Hale","Nakamura",
      "Alvarez","Brooks","Varga","Rahman","OConnor","Sharma","Bell","Tanaka","Lindqvist","Farid",
      "Weiss","Dupont","Berg","Soto","Hartmann","Ahmed","Cole","Lin","Park","Singh"
    ];

    function makeSigPath(seed) {
      const r = (n) => { const x = Math.sin(seed * 997 + n * 71.3) * 10000; return x - Math.floor(x); };
      let d = `M ${6 + r(1)*8} ${18 + r(2)*10}`;
      const segs = 3 + Math.floor(r(3) * 5);
      for (let i = 0; i < segs; i++) {
        const x = 12 + (i + 1) * (130 / (segs + 1)) + (r(10+i) - 0.5) * 16;
        const y = 6 + r(20+i) * 26;
        d += ` Q ${(x - 12 + (r(30+i)-0.5)*18).toFixed(1)} ${(y + (r(40+i)-0.5)*20).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`;
      }
      if (r(50) > 0.5) d += ` Q 135 ${8 + r(51)*12} 142 ${16 + r(52)*10}`;
      return d;
    }

    function formatDate(d) {
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      const yy = String(d.getFullYear()).slice(-2);
      return `${mm}/${dd}/${yy}`;
    }

    function daysAgo(n) {
      const d = new Date();
      d.setDate(d.getDate() - n);
      return d;
    }

    function generateGuests(count) {
      const list = [];
      for (let i = 0; i < count; i++) {
        const days = Math.floor(Math.pow(Math.random(), 1.3) * 160);
        const date = daysAgo(days);
        const type = Math.floor(Math.random() * 4);
        const id = 10000 + (count - i);
        const name = `${FIRST[Math.floor(Math.random()*FIRST.length)]} ${LAST[Math.floor(Math.random()*LAST.length)]}`.toUpperCase();
        const signed = Math.random() > 0.1;
        list.push({
          id,
          name,
          date: formatDate(date),
          type,
          signed,
          sigPath: signed ? makeSigPath(id * 11.3 + type) : null,
          sigText: signed && Math.random() > 0.68 ? name.split(" ")[0].toLowerCase() : null,
          createdAt: date.getTime()
        });
      }
      list.sort((a,b) => b.createdAt - a.createdAt);
      return list;
    }

    const STORAGE_KEY = "fonda-guestbook-v2";
    let guests = [];
    let currentType = 0;
    let strokes = [];
    let currentStroke = [];
    let isDrawing = false;

    // DOM
    const screens = {
      welcome: document.getElementById("welcome"),
      sign: document.getElementById("sign"),
      gallery: document.getElementById("gallery")
    };
    const nameInput = document.getElementById("guestName");
    const previewName = document.getElementById("previewName");
    const previewDate = document.getElementById("previewDate");
    const cardPreview = document.getElementById("cardPreview");
    const canvas = document.getElementById("sigCanvas");
    const ctx = canvas.getContext("2d");
    const submitBtn = document.getElementById("submitGuest");
    const toast = document.getElementById("toast");

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove("active"));
      screens[name].classList.add("active");
      window.scrollTo(0, 0);
      // Landing (welcome/sign) stays fixed; gallery may scroll
      if (name === "gallery") {
        document.body.classList.remove("no-scroll");
      } else {
        document.body.classList.add("no-scroll");
      }
      if (name === "gallery") {
        renderGallery();
        updateStats();
      }
      if (name === "sign") setTimeout(resizeCanvas, 50);
      // Momo: show on every page except landing
      if (window.MomoMascot) {
        if (name === "welcome") {
          try { MomoMascot.destroy(); } catch (e) {}
        } else if (!document.querySelector(".momo-mascot")) {
          MomoMascot.init();
        }
      }
    }

    // ——— Canvas (smooth pointer drawing) ———
    let lastPoint = null;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      if (rect.width < 8) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(255,255,255,0.95)";
      ctx.lineWidth = 2.4;
      redraw();
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const src = e.touches && e.touches[0] ? e.touches[0]
                : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
      return {
        x: (src.clientX - rect.left),
        y: (src.clientY - rect.top)
      };
    }

    function strokeSegment(from, to) {
      // Midpoint quadratic smoothing for fluid ink
      const midX = (from.x + to.x) / 2;
      const midY = (from.y + to.y) / 2;
      ctx.quadraticCurveTo(from.x, from.y, midX, midY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(midX, midY);
    }

    function startDraw(e) {
      e.preventDefault();
      isDrawing = true;
      currentStroke = [];
      const p = getPos(e);
      currentStroke.push(p);
      lastPoint = p;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      // tiny dot so a single tap still shows
      ctx.lineTo(p.x + 0.01, p.y + 0.01);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const p = getPos(e);
      // skip near-duplicate points for less jagged lines
      if (lastPoint) {
        const dx = p.x - lastPoint.x;
        const dy = p.y - lastPoint.y;
        if (dx * dx + dy * dy < 0.8) return;
      }
      currentStroke.push(p);
      if (lastPoint) strokeSegment(lastPoint, p);
      lastPoint = p;
    }

    function endDraw(e) {
      if (!isDrawing) return;
      if (e) e.preventDefault();
      isDrawing = false;
      // finish last segment cleanly
      if (lastPoint && currentStroke.length) {
        const p = currentStroke[currentStroke.length - 1];
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }
      if (currentStroke.length > 1) strokes.push([...currentStroke]);
      currentStroke = [];
      lastPoint = null;
      updateSubmit();
    }

    function drawStrokePath(s) {
      if (s.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(s[0].x, s[0].y);
      for (let i = 1; i < s.length - 1; i++) {
        const midX = (s[i].x + s[i + 1].x) / 2;
        const midY = (s[i].y + s[i + 1].y) / 2;
        ctx.quadraticCurveTo(s[i].x, s[i].y, midX, midY);
      }
      const last = s[s.length - 1];
      ctx.lineTo(last.x, last.y);
      ctx.stroke();
    }

    function redraw() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(255,255,255,0.95)";
      ctx.lineWidth = 2.4;
      strokes.forEach(drawStrokePath);
    }

    function clearSig() {
      strokes = [];
      currentStroke = [];
      lastPoint = null;
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      updateSubmit();
    }

    function undoSig() {
      strokes.pop();
      redraw();
      updateSubmit();
    }

    // Pointer Events API (smoother than separate mouse/touch)
    if (window.PointerEvent) {
      canvas.addEventListener("pointerdown", (e) => {
        canvas.setPointerCapture(e.pointerId);
        startDraw(e);
      });
      canvas.addEventListener("pointermove", draw);
      canvas.addEventListener("pointerup", endDraw);
      canvas.addEventListener("pointercancel", endDraw);
    } else {
      canvas.addEventListener("mousedown", startDraw);
      canvas.addEventListener("mousemove", draw);
      canvas.addEventListener("mouseup", endDraw);
      canvas.addEventListener("mouseleave", endDraw);
      canvas.addEventListener("touchstart", startDraw, { passive: false });
      canvas.addEventListener("touchmove", draw, { passive: false });
      canvas.addEventListener("touchend", endDraw);
    }

    // ——— UI helpers ———
    function setType(t) {
      currentType = t;
      cardPreview.className = `card-preview type-${t}`;
      document.querySelectorAll(".card-thumb").forEach(btn => {
        btn.classList.toggle("selected", Number(btn.dataset.type) === t);
      });
    }

    function updatePreview() {
      const v = nameInput.value.trim() || "YOUR NAME";
      previewName.textContent = v.toUpperCase();
      updateSubmit();
    }

    function updateSubmit() {
      const ok = nameInput.value.trim().length >= 2 && strokes.length > 0;
      submitBtn.disabled = !ok;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    // ——— Storage ———
    function loadGuests() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) { guests = JSON.parse(raw); return; }
      } catch (e) {}
      guests = generateGuests(147);
      saveGuests();
    }
    function saveGuests() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(guests)); } catch (e) {}
    }

    // ——— Render ———
    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function renderCard(g) {
      const el = document.createElement("article");
      el.className = `guest-card type-${g.type}`;
      el.dataset.id = g.id;
      let sig = "";
      if (g.signed) {
        if (g.sigDataUrl) sig = `<img src="${g.sigDataUrl}" alt="" />`;
        else if (g.sigText) sig = `<span class="g-sig-text">${escapeHtml(g.sigText)}</span>`;
        else if (g.sigPath) sig = `<svg viewBox="0 0 150 42" width="110" height="30" fill="none"><path d="${g.sigPath}" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      }
      el.innerHTML = `
        <div class="g-name">${escapeHtml(g.name)}</div>
        <div class="g-date">${g.date}</div>
        <div class="g-meta">
          <span class="g-no">NO. ${g.id}</span>
          <div class="g-sig">${sig}</div>
        </div>`;
      el.onclick = () => openModal(g);
      return el;
    }

    function renderGallery(list = guests) {
      const grid = document.getElementById("galleryGrid");
      grid.innerHTML = "";
      const frag = document.createDocumentFragment();
      list.forEach(g => frag.appendChild(renderCard(g)));
      grid.appendChild(frag);
      document.getElementById("guestCount").textContent =
        `${guests.length.toLocaleString()} guests have signed in.`;
    }

    function updateStats() {
      const total = guests.length;
      const signed = guests.filter(g => g.signed).length;
      const counts = [0,0,0,0];
      guests.forEach(g => counts[g.type]++);
      const labels = ["Lavender","Sage","Sky","Rose"];
      const parts = labels.map((l,i) => {
        const p = total ? Math.round(counts[i]/total*100) : 0;
        return `<span><strong>${p}%</strong> ${l}</span>`;
      });
      document.getElementById("statsBar").innerHTML =
        `<span><strong>${Math.round(signed/total*100)}%</strong> signed</span>` +
        parts.join("") +
        `<span>Latest: <strong>${guests[0] ? guests[0].date : "—"}</strong></span>`;
    }

    function openModal(g) {
      const card = document.getElementById("modalCard");
      card.className = `big-card type-${g.type}`;
      card.style.backgroundImage = `url(card${g.type+1}.png)`;
      let sig = "";
      if (g.signed) {
        if (g.sigDataUrl) sig = `<img src="${g.sigDataUrl}" alt="" style="max-width:140px;max-height:40px" />`;
        else if (g.sigText) sig = `<span class="g-sig-text" style="font-size:22px">${escapeHtml(g.sigText)}</span>`;
        else if (g.sigPath) sig = `<svg viewBox="0 0 150 42" width="130" height="36" fill="none"><path d="${g.sigPath}" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      }
      card.innerHTML = `
        <div class="g-name" style="font-size:18px;top:36%">${escapeHtml(g.name)}</div>
        <div class="g-date" style="font-size:15px;top:54%">${g.date}</div>
        <div class="g-meta" style="bottom:13%">
          <span class="g-no">NO. ${g.id}</span>
          <div class="g-sig">${sig}</div>
        </div>`;
      // reuse absolute styles from guest-card
      card.querySelectorAll(".g-name,.g-date,.g-meta,.g-no,.g-sig").forEach(n => {
        n.style.position = n.classList.contains("g-meta") ? "absolute" : "absolute";
        n.style.color = "#fff";
      });
      document.getElementById("modal").classList.add("open");
    }

    // ——— Submit ———
    function submitGuest() {
      const name = nameInput.value.trim().toUpperCase();
      if (name.length < 2 || strokes.length === 0) return;

      const rect = canvas.getBoundingClientRect();
      const temp = document.createElement("canvas");
      temp.width = Math.round(rect.width * 2);
      temp.height = Math.round(rect.height * 2);
      const tctx = temp.getContext("2d");
      tctx.scale(2, 2);
      tctx.lineWidth = 2.3;
      tctx.lineCap = "round";
      tctx.lineJoin = "round";
      tctx.strokeStyle = "#fff";
      strokes.forEach(s => {
        if (s.length < 2) return;
        tctx.beginPath();
        tctx.moveTo(s[0].x, s[0].y);
        for (let i = 1; i < s.length - 1; i++) {
          const midX = (s[i].x + s[i + 1].x) / 2;
          const midY = (s[i].y + s[i + 1].y) / 2;
          tctx.quadraticCurveTo(s[i].x, s[i].y, midX, midY);
        }
        const last = s[s.length - 1];
        tctx.lineTo(last.x, last.y);
        tctx.stroke();
      });
      const dataUrl = temp.toDataURL("image/png");

      const nextId = guests.length ? Math.max(...guests.map(g => g.id)) + 1 : 10148;
      guests.unshift({
        id: nextId,
        name,
        date: formatDate(new Date()),
        type: currentType,
        signed: true,
        sigDataUrl: dataUrl,
        createdAt: Date.now()
      });
      saveGuests();

      // soft chime if available
      try {
        const a = new Audio("chimes.mp3");
        a.volume = 0.35;
        a.play().catch(() => {});
      } catch (e) {}

      nameInput.value = "";
      previewName.textContent = "YOUR NAME";
      clearSig();
      setType(0);
      showToast("Thanks for signing!");
      // Enter Fonda's Little World
      setTimeout(function () {
        window.location.href = "home.html";
      }, 600);
    }

    // ——— Events ———
    document.getElementById("startBtn").onclick = () => showScreen("sign");
    document.getElementById("skipToGallery").onclick = () => showScreen("gallery");
    document.getElementById("backToWelcome").onclick = () => showScreen("welcome");
    document.getElementById("signAgainBtn").onclick = () => showScreen("sign");
    document.getElementById("galleryBackBtn").onclick = () => showScreen("welcome");
    document.getElementById("enterWorldFromGallery").onclick = () => {
      window.location.href = "home.html";
    };
    document.getElementById("shuffleBtn").onclick = () => {
      const shuffled = [...guests].sort(() => Math.random() - 0.5);
      renderGallery(shuffled);
    };
    document.getElementById("clearSig").onclick = clearSig;
    document.getElementById("undoSig").onclick = undoSig;
    document.getElementById("submitGuest").onclick = submitGuest;
    document.getElementById("modalClose").onclick = () => document.getElementById("modal").classList.remove("open");
    document.getElementById("modal").onclick = (e) => {
      if (e.target.id === "modal") document.getElementById("modal").classList.remove("open");
    };

    nameInput.addEventListener("input", updatePreview);
    document.querySelectorAll(".card-thumb").forEach(btn => {
      btn.addEventListener("click", () => setType(Number(btn.dataset.type)));
    });

    // Init
    previewDate.textContent = formatDate(new Date());
    loadGuests();
    setType(0);
    updatePreview();
    document.body.classList.add("no-scroll");

    // Deep-link: ?view=gallery or #gallery from portfolio "Guest Book" tab
    const params = new URLSearchParams(window.location.search);
    if (params.get("view") === "gallery" || window.location.hash === "#gallery") {
      showScreen("gallery");
    }

    window.addEventListener("resize", () => {
      if (screens.sign.classList.contains("active")) resizeCanvas();
    });
  </script>

  <script>
    // iPod player (assets unchanged — logic from original iPod/index.html)
    (function () {
      const audio = document.getElementById('audio');
      const layer = document.getElementById('progressLayer');
      const btn = document.getElementById('playBtn');
      const ipod = document.getElementById('ipod');
      if (!audio || !layer || !btn || !ipod) return;

      let rafId = null;
      const STRIP_START = 39.81;
      const STRIP_END = 52.58;

      function setProgress(ratio) {
        const r = Math.min(1, Math.max(0, ratio));
        const pct = STRIP_START + r * (STRIP_END - STRIP_START);
        layer.style.setProperty('--progress', pct + '%');
      }
      function tick() {
        if (audio.duration && !isNaN(audio.duration)) {
          setProgress(audio.currentTime / audio.duration);
        }
        if (!audio.paused) rafId = requestAnimationFrame(tick);
        else rafId = null;
      }
      function startProgressLoop() {
        if (rafId == null) rafId = requestAnimationFrame(tick);
      }
      function stopProgressLoop() {
        if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; }
      }
      async function togglePlay() {
        try {
          if (audio.paused) {
            if (audio.readyState < 2) audio.load();
            await audio.play();
            btn.setAttribute('aria-label', 'Pause introduction');
            startProgressLoop();
          } else {
            audio.pause();
            btn.setAttribute('aria-label', 'Play introduction');
            stopProgressLoop();
            if (audio.duration) setProgress(audio.currentTime / audio.duration);
          }
        } catch (err) {
          console.error('Playback failed:', err);
        }
      }
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        togglePlay();
      });
      ipod.addEventListener('click', function (e) {
        if (e.target === btn || btn.contains(e.target)) return;
        togglePlay();
      });
      audio.addEventListener('ended', function () {
        setProgress(1);
        btn.setAttribute('aria-label', 'Play introduction');
        stopProgressLoop();
        setTimeout(function () {
          audio.currentTime = 0;
          setProgress(0);
        }, 400);
      });
      audio.addEventListener('pause', function () {
        stopProgressLoop();
        if (audio.duration) setProgress(audio.currentTime / audio.duration);
      });
      audio.addEventListener('play', startProgressLoop);
      audio.addEventListener('timeupdate', function () {
        if (audio.duration && !isNaN(audio.duration)) {
          setProgress(audio.currentTime / audio.duration);
        }
      });
      audio.load();
    })();
  </script>
